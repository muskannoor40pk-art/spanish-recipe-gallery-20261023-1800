<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Recetas Gourmet</title>
    
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Galería de Recetas</h1>
    <div class="controls">
        <input type="text" id="search" placeholder="Buscar por nombre o ingrediente...">
        <select id="categoryFilter">
            <option value="todas">Todas las categorías</option>
            <option value="Desayuno">Desayuno</option>
            <option value="Almuerzo">Almuerzo</option>
            <option value="Cena">Cena</option>
            <option value="Postre">Postre</option>
        </select>
    </div>
</header>

<main class="gallery" id="gallery"></main>

<div class="modal" id="modal">
    <div class="modal-content">
        <button class="close-btn" id="closeModal">&times;</button>
        <h2 id="modalTitle"></h2>
        <p><strong id="modalCategory"></strong></p>
        <hr style="margin: 1rem 0;">
        <h3>Ingredientes:</h3>
        <ul id="modalIngredients"></ul>
        <h3 style="margin-top: 1rem;">Preparación:</h3>
        <p id="modalInstructions"></p>
    </div>
</div>

<script>
    const recipes = [
        { id: 1, title: "Tacos al Pastor", category: "Almuerzo", ingredients: ["Carne de cerdo", "Piña", "Tortillas", "Cebolla", "Cilantro"], instructions: "Marinar el cerdo con achiote, cocinar en trompo y servir con piña y cilantro." },
        { id: 2, title: "Paella Valenciana", category: "Cena", ingredients: ["Arroz", "Azafrán", "Pollo", "Conejo", "Judías verdes"], instructions: "Sofreír las carnes, añadir el arroz y el caldo con azafrán, cocinar hasta que el líquido se absorba." },
        { id: 3, title: "Chilaquiles Verdes", category: "Desayuno", ingredients: ["Totopos", "Salsa verde", "Crema", "Queso fresco", "Cebolla"], instructions: "Bañar los totopos en salsa verde caliente, decorar con crema, queso y cebolla." },
        { id: 4, title: "Flan de Caramelo", category: "Postre", ingredients: ["Huevos", "Leche condensada", "Leche evaporada", "Azúcar"], instructions: "Preparar el caramelo, batir los lácteos con huevos y hornear a baño maría." }
    ];

    const gallery = document.getElementById('gallery');
    const search = document.getElementById('search');
    const categoryFilter = document.getElementById('categoryFilter');
    const modal = document.getElementById('modal');

    function render(filterText = '', category = 'todas') {
        gallery.innerHTML = '';
        const filtered = recipes.filter(r => 
            (r.title.toLowerCase().includes(filterText.toLowerCase()) || r.ingredients.some(i => i.toLowerCase().includes(filterText.toLowerCase()))) &&
            (category === 'todas' || r.category === category)
        );

        filtered.forEach(r => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div class="card-content">
                    <span class="tag">${r.category}</span>
                    <h3>${r.title}</h3>
                    <p>${r.ingredients.slice(0, 3).join(', ')}...</p>
                </div>
            `;
            div.onclick = () => openModal(r);
            gallery.appendChild(div);
        });
    }

    function openModal(recipe) {
        document.getElementById('modalTitle').textContent = recipe.title;
        document.getElementById('modalCategory').textContent = "Categoría: " + recipe.category;
        document.getElementById('modalIngredients').innerHTML = recipe.ingredients.map(i => `<li>${i}</li>`).join('');
        document.getElementById('modalInstructions').textContent = recipe.instructions;
        modal.style.display = 'flex';
    }

    document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
    search.oninput = () => render(search.value, categoryFilter.value);
    categoryFilter.onchange = () => render(search.value, categoryFilter.value);

    render();
</script>

</body>
</html>
